# RepoFlow — orchestration Docker Compose
#
# Monolithe modulaire : un service backend (FastAPI) et un service frontend
# (Vite) pour le développement. Le worker d'analyse partage l'image backend
# (Phase 4) ; un PostgreSQL optionnel est proposé via le profil "postgres".
#
# Usage :
#   cp .env.example .env
#   docker compose up --build
#   Backend  : http://localhost:8000
#   Frontend : http://localhost:5173
#
# Avec PostgreSQL (production) :
#   REPOFLOW_DATABASE_URL=postgresql+psycopg://repoflow:motdepasse@postgres:5432/repoflow
#   REPOFLOW_INSTALL_POSTGRES=true
#   docker compose --profile postgres up --build
#
# Avec un cache Redis partagé (multi-instances) :
#   REPOFLOW_CACHE_BACKEND=redis
#   REPOFLOW_CACHE_REDIS_URL=redis://redis:6379/0
#   docker compose --profile redis up --build

services:
  backend:
    build:
      context: ./backend
      args:
        REPOFLOW_INSTALL_POSTGRES: ${REPOFLOW_INSTALL_POSTGRES:-false}
    environment:
      REPOFLOW_ENVIRONMENT: ${REPOFLOW_ENVIRONMENT:-development}
      REPOFLOW_DATABASE_URL: ${REPOFLOW_DATABASE_URL:-sqlite+pysqlite:////data/repoflow.db}
      REPOFLOW_AUTO_CREATE_TABLES: ${REPOFLOW_AUTO_CREATE_TABLES:-true}
      REPOFLOW_GITHUB_PROVIDER: ${REPOFLOW_GITHUB_PROVIDER:-demo}
      REPOFLOW_GITHUB_TOKEN: ${REPOFLOW_GITHUB_TOKEN:-}
      REPOFLOW_CORS_ORIGINS: ${REPOFLOW_CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      REPOFLOW_KILL_SWITCH_ENGAGED: ${REPOFLOW_KILL_SWITCH_ENGAGED:-false}
      REPOFLOW_WORKER_ENABLED: ${REPOFLOW_WORKER_ENABLED:-false}
      REPOFLOW_CACHE_BACKEND: ${REPOFLOW_CACHE_BACKEND:-memory}
      REPOFLOW_CACHE_REDIS_URL: ${REPOFLOW_CACHE_REDIS_URL:-redis://redis:6379/0}
    volumes:
      - repoflow-data:/data
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/live', timeout=2)\" || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  # Base de données PostgreSQL optionnelle (profil "postgres").
  # Activer uniquement avec --profile postgres ; le backend reste sur SQLite
  # par défaut et utilise PostgreSQL si REPOFLOW_DATABASE_URL le pointe ici.
  postgres:
    image: postgres:17-alpine
    profiles: ["postgres"]
    environment:
      POSTGRES_USER: repoflow
      POSTGRES_PASSWORD: ${REPOFLOW_DB_PASSWORD:-repoflow}
      POSTGRES_DB: repoflow
    volumes:
      - repoflow-pg-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repoflow -d repoflow"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Cache Redis partagé optionnel (profil "redis").
  # Activer uniquement avec --profile redis ; le backend reste sur le cache
  # mémoire par défaut et utilise Redis si REPOFLOW_CACHE_BACKEND=redis.
  redis:
    image: redis:7-alpine
    profiles: ["redis"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_BASE_URL: /api
      VITE_PROXY_TARGET: http://backend:8000
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:5173 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  repoflow-data:
  repoflow-pg-data:
