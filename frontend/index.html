<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="RepoFlow — supervisez plusieurs dépôts GitHub, leurs pull requests et leurs checks CI."
    />
    <title>RepoFlow</title>
    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem('repoflow-theme')
          var prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches
          var theme = stored === 'light' || stored === 'dark' ? stored : prefersLight ? 'light' : 'dark'
          if (theme === 'light') {
            document.documentElement.classList.add('theme-light')
          }
        } catch (error) {
          // Préférences indisponibles : le thème sombre reste appliqué.
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
