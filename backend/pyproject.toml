[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "repoflow-backend"
version = "0.1.0"
description = "RepoFlow backend : supervision multi-dépôts GitHub (issues, pull requests, checks CI)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "RepoFlow contributors" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.10",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]
# Support PostgreSQL (base recommandée en production).
postgres = [
    "psycopg[binary]>=3.1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4", "SIM", "RUF"]
ignore = ["B008"]  # FastAPI Depends() dans les signatures.

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
# Migrations générées automatiquement : la longueur des lignes n'est pas
# pertinente.
"alembic/versions/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra -q --cov=app --cov-report=term-missing"
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
# Seuil de couverture : la CI échoue en dessous.
fail_under = 90
show_missing = true
