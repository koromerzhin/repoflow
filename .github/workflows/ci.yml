name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff (lint)
        run: ruff check .
      - name: Ruff (format)
        run: ruff format --check .
      - name: Vérifier les migrations Alembic
        env:
          REPOFLOW_DATABASE_URL: sqlite+pysqlite:///./ci.db
        run: |
          alembic upgrade head
          alembic downgrade base
      - name: Tests Pytest (couverture, seuil 90 %)
        run: pytest

  frontend:
    name: Frontend (lint + typecheck + tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Installer les dépendances
        run: npm ci
      - name: ESLint
        run: npm run lint
      - name: TypeScript (typecheck)
        run: npm run typecheck
      - name: Tests Vitest
        run: npm test
      - name: Tests Vitest (couverture, seuil 85 %)
        run: npm run test:coverage
      - name: Build de production
        run: npm run build
